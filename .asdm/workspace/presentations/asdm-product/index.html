<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASDM - AI驱动的软件开发方法论</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-deep: #0f0f1a;
      --bg-surface: #1a1a2e;
      --bg-card: #1e1e35;
      --bg-code: #141422;
      --accent: #4f46e5;
      --accent-light: #6366f1;
      --accent-glow: rgba(79, 70, 229, 0.3);
      --purple: #7c3aed;
      --green: #22c55e;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --border: rgba(255, 255, 255, 0.08);
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      --font-mono: 'Fira Code', 'Cascadia Code', 'JetBrains Mono', 'SF Mono', Consolas, monospace;
      --transition: 0.3s ease;
    }

    html { font-size: 16px; }

    body {
      font-family: var(--font-sans);
      background: var(--bg-deep);
      color: var(--text-primary);
      line-height: 1.7;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* ===== Landing Page ===== */
    #landing {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 2rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    #landing::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 30% 40%, rgba(79, 70, 229, 0.12) 0%, transparent 50%),
                  radial-gradient(circle at 70% 60%, rgba(124, 58, 237, 0.08) 0%, transparent 50%);
      animation: bgShift 20s ease-in-out infinite;
    }

    @keyframes bgShift {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-5%, 3%); }
    }

    #landing > * { position: relative; z-index: 1; }

    .landing-badge {
      display: inline-block;
      padding: 0.35rem 1rem;
      border: 1px solid var(--accent);
      border-radius: 999px;
      font-size: 0.8rem;
      color: var(--accent-light);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
      background: rgba(79, 70, 229, 0.08);
    }

    #landing h1 {
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 800;
      line-height: 1.15;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #f1f5f9 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .landing-subtitle {
      font-size: clamp(1rem, 2.5vw, 1.4rem);
      color: var(--text-secondary);
      margin-bottom: 0.75rem;
      font-weight: 300;
    }

    .landing-desc {
      font-size: 0.95rem;
      color: var(--text-muted);
      max-width: 600px;
      margin-bottom: 2.5rem;
      line-height: 1.8;
    }

    .slide-count-badge {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
    }

    #play-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      padding: 1rem 2.5rem;
      font-size: 1.1rem;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, var(--accent) 0%, var(--purple) 100%);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all var(--transition);
      box-shadow: 0 4px 24px var(--accent-glow);
      font-family: var(--font-sans);
    }

    #play-btn:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 8px 32px rgba(79, 70, 229, 0.45);
    }

    #play-btn:active { transform: translateY(0) scale(0.98); }

    .play-icon {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .keyboard-hint {
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .keyboard-hint kbd {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 0.75rem;
    }

    /* ===== Presentation Mode ===== */
    #presentation {
      display: none;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      background: var(--bg-deep);
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    #presentation.active {
      display: flex;
      opacity: 1;
    }

    #slide-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-y: auto;
      padding: 2rem 2rem 1rem;
    }

    .slide {
      max-width: 900px;
      width: 100%;
      display: none;
      animation: slideIn 0.35s ease;
    }

    .slide.active { display: block; }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .slide-title {
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      font-weight: 700;
      margin-bottom: 1.5rem;
      padding-bottom: 0.75rem;
      border-bottom: 2px solid var(--accent);
      color: var(--text-primary);
    }

    .slide h2 {
      font-size: 1.4rem;
      font-weight: 600;
      color: var(--accent-light);
      margin-top: 1.5rem;
      margin-bottom: 0.75rem;
    }

    .slide h3 {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-top: 1.2rem;
      margin-bottom: 0.5rem;
    }

    .slide h4 {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-top: 1rem;
      margin-bottom: 0.4rem;
    }

    .slide p {
      color: var(--text-secondary);
      margin-bottom: 0.75rem;
      line-height: 1.8;
    }

    .slide strong { color: var(--text-primary); font-weight: 600; }
    .slide em { color: var(--accent-light); font-style: italic; }

    .slide ul, .slide ol {
      margin: 0.5rem 0 1rem 1.5rem;
      color: var(--text-secondary);
    }

    .slide li { margin-bottom: 0.4rem; line-height: 1.7; }
    .slide li::marker { color: var(--accent-light); }

    .slide code {
      font-family: var(--font-mono);
      background: var(--bg-code);
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      font-size: 0.88em;
      color: #a5b4fc;
      border: 1px solid var(--border);
    }

    .slide pre {
      background: var(--bg-code);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem 1.25rem;
      margin: 0.75rem 0 1rem;
      overflow-x: auto;
      line-height: 1.6;
    }

    .slide pre code {
      background: none;
      padding: 0;
      border: none;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .slide table {
      width: 100%;
      border-collapse: collapse;
      margin: 0.75rem 0 1rem;
      font-size: 0.9rem;
    }

    .slide th {
      background: var(--bg-card);
      color: var(--accent-light);
      font-weight: 600;
      padding: 0.65rem 1rem;
      text-align: left;
      border-bottom: 2px solid var(--accent);
    }

    .slide td {
      padding: 0.55rem 1rem;
      border-bottom: 1px solid var(--border);
      color: var(--text-secondary);
    }

    .slide tr:nth-child(even) td { background: rgba(255, 255, 255, 0.02); }
    .slide tr:hover td { background: rgba(79, 70, 229, 0.06); }

    .slide hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 1.25rem 0;
    }

    .slide blockquote {
      border-left: 3px solid var(--accent);
      padding: 0.75rem 1.25rem;
      margin: 1rem 0;
      background: rgba(79, 70, 229, 0.06);
      border-radius: 0 8px 8px 0;
      color: var(--text-secondary);
      font-style: italic;
      font-size: 1.05rem;
    }

    .slide img {
      max-width: 100%;
      border-radius: 8px;
      margin: 0.5rem 0;
    }

    .slide a {
      color: var(--accent-light);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color var(--transition);
    }

    .slide a:hover { border-bottom-color: var(--accent-light); }

    /* ===== Navigation Bar ===== */
    #nav-bar {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1.5rem;
      background: var(--bg-surface);
      border-top: 1px solid var(--border);
      user-select: none;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg-card);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--transition);
      font-size: 1.1rem;
      font-family: var(--font-sans);
    }

    .nav-btn:hover {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .nav-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .nav-btn:disabled:hover {
      background: var(--bg-card);
      color: var(--text-secondary);
      border-color: var(--border);
    }

    #progress {
      flex: 1;
      height: 4px;
      background: var(--bg-code);
      border-radius: 2px;
      overflow: hidden;
    }

    #progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--purple));
      border-radius: 2px;
      transition: width 0.3s ease;
    }

    #slide-counter {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      min-width: 60px;
      text-align: center;
    }

    #exit-btn { font-size: 1rem; }

    /* ===== Scrollbar ===== */
    #slide-container::-webkit-scrollbar { width: 6px; }
    #slide-container::-webkit-scrollbar-track { background: transparent; }
    #slide-container::-webkit-scrollbar-thumb {
      background: var(--text-muted);
      border-radius: 3px;
    }
    #slide-container::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }

    /* ===== Responsive ===== */
    @media (max-width: 768px) {
      #landing h1 { font-size: 2rem; }
      .slide-title { font-size: 1.5rem; }
      .slide h2 { font-size: 1.2rem; }
      #nav-bar { padding: 0.5rem 1rem; gap: 0.5rem; }
      .nav-btn { width: 36px; height: 36px; }
    }

    /* ===== Fullscreen adjustments ===== */
    :fullscreen #nav-bar,
    :-webkit-full-screen #nav-bar {
      padding: 0.75rem 2rem;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- ===== Landing Page ===== -->
  <div id="landing">
    <div class="landing-badge">Agentic Software Development Methodology</div>
    <h1>ASDM</h1>

    </p>
    <div class="slide-count-badge">12 张演示页面</div>
    <button id="play-btn" aria-label="开始演示">
      <svg class="play-icon" viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>

    </button>
    <div class="keyboard-hint">

  <!-- ===== Presentation Mode ===== -->
  <div id="presentation">
    <div id="slide-container">

      <button class="nav-btn" id="prev-btn" aria-label="上一页">←</button>

      <button class="nav-btn" id="exit-btn" aria-label="退出演示">✕</button>

  </div>

  <script>
    // ===== Slide Data =====

    // ===== App State =====
    let currentSlide = 0;
    const totalSlides = slides.length;

    // ===== DOM Elements =====
    const landing = document.getElementById('landing');
    const presentation = document.getElementById('presentation');
    const slideContainer = document.getElementById('slide-container');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const exitBtn = document.getElementById('exit-btn');
    const playBtn = document.getElementById('play-btn');
    const progressBar = document.getElementById('progress-bar');
    const slideCounter = document.getElementById('slide-counter');

    // ===== Initialize Slides =====
    function initSlides() {
      slideContainer.innerHTML = '';
      slides.forEach((slide, i) => {
        const div = document.createElement('div');
        div.className = 'slide' + (i === 0 ? ' active' : '');
        div.innerHTML = `<h1 class="slide-title">${slide.title}</h1>${slide.content}`;
        slideContainer.appendChild(div);
      });
      updateNav();
    }

    // ===== Navigation =====
    function goToSlide(index) {
      if (index < 0 || index >= totalSlides) return;
      const slideEls = slideContainer.querySelectorAll('.slide');
      slideEls[currentSlide].classList.remove('active');
      currentSlide = index;
      slideEls[currentSlide].classList.add('active');
      slideContainer.scrollTop = 0;
      updateNav();
    }

    function nextSlide() { goToSlide(currentSlide + 1); }
    function prevSlide() { goToSlide(currentSlide - 1); }

    function updateNav() {
      prevBtn.disabled = currentSlide === 0;
      nextBtn.disabled = currentSlide === totalSlides - 1;
      progressBar.style.width = ((currentSlide + 1) / totalSlides * 100) + '%';
      slideCounter.textContent = `${currentSlide + 1} / ${totalSlides}`;
    }

    // ===== Fullscreen =====
    function enterPresentation() {
      landing.classList.add('hidden');
      presentation.classList.add('active');
      document.body.style.overflow = 'hidden';
      goToSlide(0);
      const el = document.documentElement;
      if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    }

    function exitPresentation() {
      presentation.classList.remove('active');
      landing.classList.remove('hidden');
      document.body.style.overflow = 'hidden';
      if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
      else if (document.webkitFullscreenElement) document.webkitExitFullscreen();
    }

    // ===== Event Listeners =====
    playBtn.addEventListener('click', enterPresentation);
    exitBtn.addEventListener('click', exitPresentation);
    prevBtn.addEventListener('click', prevSlide);
    nextBtn.addEventListener('click', nextSlide);

    document.addEventListener('keydown', (e) => {
      if (!presentation.classList.contains('active')) return;
      switch (e.key) {
        case 'ArrowRight':
        case ' ':
          e.preventDefault();
          nextSlide();
          break;
        case 'ArrowLeft':
          e.preventDefault();
          prevSlide();
          break;
        case 'Escape':
          e.preventDefault();
          exitPresentation();
          break;
        case 'Home':
          e.preventDefault();
          goToSlide(0);
          break;
        case 'End':
          e.preventDefault();
          goToSlide(totalSlides - 1);
          break;
      }
    });

    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement && presentation.classList.contains('active')) {
        // User exited fullscreen via browser, stay in presentation but not browser-fullscreen
      }
    });

    // ===== Init =====
    initSlides();
  </script>
